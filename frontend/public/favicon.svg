<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <!-- Inner Glow Gradient -->
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Sparkle / Accent Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle Highlight Border -->
  <rect x="3" y="3" width="58" height="58" rx="15" fill="none" stroke="url(#innerGlow)" stroke-width="1.5" />

  <!-- Bot Antenna -->
  <circle cx="32" cy="14" r="2.5" fill="#38bdf8" />
  <line x1="32" y1="16" x2="32" y2="20" stroke="#c7d2fe" stroke-width="2" stroke-linecap="round" />

  <!-- Robot / AI Assistant Head -->
  <rect x="15" y="20" width="34" height="26" rx="8" fill="#0f172a" stroke="#818cf8" stroke-width="2" />

  <!-- Screen Visor Glass -->
  <rect x="18" y="23" width="28" height="15" rx="5" fill="#1e1b4b" />

  <!-- AI Glowing Eyes -->
  <rect x="22" y="27" width="6" height="7" rx="3" fill="#38bdf8" />
  <rect x="36" y="27" width="6" height="7" rx="3" fill="#38bdf8" />

  <!-- Sparkle in Left Eye -->
  <circle cx="23.5" cy="28.5" r="1" fill="#ffffff" />
  <circle cx="37.5" cy="28.5" r="1" fill="#ffffff" />

  <!-- Friendly Smile / Voice Waveform -->
  <path d="M28 41 Q32 44 36 41" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Left & Right Ear Connectors -->
  <rect x="11" y="28" width="4" height="10" rx="2" fill="#818cf8" />
  <rect x="49" y="28" width="4" height="10" rx="2" fill="#818cf8" />

  <!-- AI Magic Sparkle / Star (Top Right) -->
  <g transform="translate(43, 8) scale(0.9)">
    <path d="M7 0 L8.8 4.2 L14 7 L8.8 9.8 L7 14 L5.2 9.8 L0 7 L5.2 4.2 Z" fill="#38bdf8" filter="url(#glow)" />
    <circle cx="7" cy="7" r="1.5" fill="#ffffff" />
  </g>

  <!-- Online Green Status Indicator Dot -->
  <circle cx="48" cy="46" r="3.5" fill="#10b981" stroke="#0f172a" stroke-width="1.5" />
</svg>